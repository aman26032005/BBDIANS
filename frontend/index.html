<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BBDIANS — Anonymous Confessions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #2d1b69 0%, transparent 35%),
                radial-gradient(circle at bottom right, #581c87 0%, transparent 35%),
                #09090f;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: 800;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );

            box-shadow:
                0 15px 40px rgba(139, 92, 246, 0.35);
        }

        h1 {
            font-size: 38px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tagline {
            color: #b7b7c9;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 24px;

            padding: 25px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .card h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .card p {
            color: #a7a7b7;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 190px;

            resize: vertical;

            background: rgba(0, 0, 0, 0.25);

            color: white;

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 16px;

            padding: 16px;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        textarea::placeholder {
            color: #777789;
        }

        textarea:focus {
            border-color: #a855f7;

            box-shadow:
                0 0 0 3px rgba(168, 85, 247, 0.12);
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 10px;

            color: #777789;

            font-size: 12px;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(236, 72, 153, 0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .privacy {
            margin-top: 18px;

            color: #858597;

            font-size: 12px;
        }

        .success {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            background: rgba(34, 197, 94, 0.12);

            border: 1px solid rgba(34, 197, 94, 0.25);

            color: #86efac;

            font-size: 14px;
        }

        .error {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            background: rgba(239, 68, 68, 0.12);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #fca5a5;

            font-size: 14px;
        }

        @media (max-width: 480px) {

            h1 {
                font-size: 32px;
            }

            .card {
                padding: 20px;
            }

            textarea {
                min-height: 170px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            B
        </div>

        <h1>BBDIANS</h1>

        <p class="tagline">
            Say what you can't say.
        </p>

        <section class="card">

            <h2>Anonymous Confession</h2>

            <p>
                Share your thoughts, feelings or confession.
                No account is required.
            </p>

            <textarea
                id="message"
                maxlength="2000"
                placeholder="Write your confession here..."
            ></textarea>

            <div class="bottom-row">
                <span>🔒 Anonymous</span>

                <span>
                    <span id="counter">0</span>/2000
                </span>
            </div>

            <button id="submitBtn">
                Send Anonymously
            </button>

            <div
                id="successMessage"
                class="success"
            >
                ❤️ Your confession has been sent successfully.
            </div>

            <div
                id="errorMessage"
                class="error"
            >
                Something went wrong. Please try again.
            </div>

        </section>

        <p class="privacy">
            Your confession is sent directly to the BBDIANS inbox.
        </p>

    </main>


    <script>

        const messageInput =
            document.getElementById("message");

        const counter =
            document.getElementById("counter");

        const submitBtn =
            document.getElementById("submitBtn");

        const successMessage =
            document.getElementById("successMessage");

        const errorMessage =
            document.getElementById("errorMessage");


        messageInput.addEventListener(
            "input",
            () => {

                counter.textContent =
                    messageInput.value.length;

            }
        );


        submitBtn.addEventListener(
            "click",
            async () => {

                const message =
                    messageInput.value.trim();


                successMessage.style.display = "none";
                errorMessage.style.display = "none";


                if (!message) {

                    errorMessage.textContent =
                        "Please write something first.";

                    errorMessage.style.display =
                        "block";

                    return;
                }


                submitBtn.disabled = true;

                submitBtn.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            "https://bbdians-backend.onrender.com/confessions/",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message: message
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Failed to send confession."
                        );

                    }


                    messageInput.value = "";

                    counter.textContent = "0";


                    successMessage.style.display =
                        "block";


                } catch (error) {

                    errorMessage.textContent =
                        error.message ||
                        "Unable to connect to BBDIANS.";

                    errorMessage.style.display =
                        "block";

                }


                submitBtn.disabled = false;

                submitBtn.textContent =
                    "Send Anonymously";

            }
        );

    </script>

</body>

</html>
